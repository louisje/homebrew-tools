name: Update tunnel-client Formula
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Formula from release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_tunnel_client.py
      - name: Commit changes
        run: |
          if git diff --quiet -- Formula/tunnel-client.rb; then
            echo "Formula is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tunnel-client.rb
          git commit -m "chore: sync tunnel-client to latest upstream-versioned fork release"
          git push
